[project]
name = "telegram-ad-v2"
version = "0.2.0"
description = "The best advertising tool for Telegram - multi-account, campaigns, message spinning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "telethon>=1.39.0",
  "typer>=0.12.5",
  "rich>=13.9.4",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "aiosqlite>=0.20.0",
  "streamlit>=1.41.0",
  "python-socks[asyncio]>=2.0.0",
]

[project.scripts]
telegram-ad-v2 = "telegram_ad_v2.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"
